[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-triage"
version = "0.1.0"
description = "Route a customer note to Billing, Technical, or Shipping, and wait for a person to approve the reply."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openai>=1.109.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
